<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>TeixaCell | Sem conexão</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#09090b;color:#f8fafc;font-family:Arial,Helvetica,sans-serif;text-align:center}
    main{width:min(100%,420px);padding:36px 28px;border:1px solid #27272a;border-radius:28px;background:#141416;box-shadow:0 20px 70px #0008}
    img{width:112px;height:112px;object-fit:contain;margin-bottom:20px}h1{font-size:22px;margin:0 0 12px}p{color:#a1a1aa;line-height:1.6;margin:0 0 24px}button{border:0;border-radius:12px;padding:13px 20px;background:#f97316;color:#111;font-weight:700;font-size:15px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="TeixaCell">
    <h1>Você está sem conexão</h1>
    <p>O TeixaCell precisa de internet para consultar e salvar informações com segurança. Verifique sua conexão e tente novamente.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
